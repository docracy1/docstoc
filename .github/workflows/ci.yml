name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install reportlab
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: node scripts/validate-static-html.mjs
        working-directory: apps/web
      - run: npm run typecheck

  # Only runs after `test` passes, and only for pushes to main. Requires a CLOUDFLARE_API_TOKEN
  # repo secret (Settings → Secrets and variables → Actions) with Workers Scripts:Edit +
  # Cloudflare Pages:Edit permissions.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: generate-seo.mjs takes sitemap lastmod from the last commit of each page.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install reportlab
      - run: npm ci
      - name: Deploy worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
        working-directory: apps/worker
      - name: Build web
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ secrets.BING_SITE_VERIFICATION }}
        run: npm run build
        working-directory: apps/web
      - name: Deploy web (Cloudflare Pages)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler pages deploy dist --project-name=chasa
        working-directory: apps/web
      - name: Skip deploy (no Cloudflare token)
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN not set — skipping deploy."
