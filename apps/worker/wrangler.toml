name = "chasa-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
# Keep workers.dev up until api.chasa.io is attached (a --domains deploy with no zone
# can otherwise disable the workers.dev route and take the API offline).
workers_dev = true
preview_urls = true

[triggers]
# Single hourly cron (account trigger limit). SPA smoke every hour; session purge + chase digests at 08:00 UTC.
crons = ["0 * * * *"]

# Custom API hosts (Cloudflare zone must be Active for each to resolve publicly).
[[routes]]
pattern = "api.docstoc.io"
custom_domain = true

[[routes]]
pattern = "api.chasa.io"
custom_domain = true

# Create with: wrangler d1 create chasa-db, then paste the returned database_id below, then run:
# wrangler d1 migrations apply chasa-db --local (dev) / --remote (prod)
[[d1_databases]]
binding = "CHASA_DB"
database_name = "chasa-db"
database_id = "1f5d8f25-0406-476e-abda-ac8f62c861aa"

# Cloudflare Analytics Engine — dual-written alongside CHASA_DB while we verify parity with
# Docracy's dashboard before cutting reads over (see lib/analytics.ts trackEventAE comments).
# No manual provisioning needed: the dataset is created automatically on first write after this
# binding is deployed. Querying it back needs a separate Cloudflare API token with Account
# Analytics:Read scope — set with: wrangler secret put CF_ANALYTICS_ENGINE_TOKEN
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "docstoc_funnel"

# Free (10k neurons/day, resets daily) — no account or API key needed.
[ai]
binding = "AI"

# --- Non-secret config ---
# This is the deployed (production) value. Local `wrangler dev` overrides it via
# apps/worker/.dev.vars, which takes precedence over [vars] when running locally.
[vars]
PUBLIC_APP_URL = "https://docstoc.io"
PUBLIC_WORKER_URL = "https://api.docstoc.io"
WORKERS_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
FEEDBACK_EMAIL = "founder@docstoc.io"
ADMIN_EMAIL = "rl@relacon.at"
# Optional second password-login allowlist entry (e.g. an app-store/OAuth reviewer who can't
# receive magic links). Leave unset to disable — password login stays admin-only.
REVIEWER_EMAIL = "reinhold.lackner@gmail.com"
STRIPE_PRICE_SOLO = "price_1U8eQrQu2Ibd9xnHMVO69tv4"
STRIPE_PRICE_PRO = "price_1TxMyFQu2Ibd9xnHPDe4L9q4"
STRIPE_PRICE_ENTERPRISE = "price_1U8eRIQu2Ibd9xnH56dwoOJ6"
# Cloudflare Turnstile site key (public). Create a widget in the CF dashboard, then paste here.
TURNSTILE_SITE_KEY = "0x4AAAAAAD-e9VZ4OPi8EPWM"

# --- Google (Sign-In + integrations connector) ---
# Client IDs are non-secret. Secrets via wrangler secret put (see comments below).
GOOGLE_LOGIN_CLIENT_ID = "808580458885-osnv7ngtf1rpvbesotrmp7a61ps05d0l.apps.googleusercontent.com"
GOOGLE_INTEGRATIONS_CLIENT_ID = "808580458885-avk646acnsu40en7f0v828ppabk4kvjt.apps.googleusercontent.com"
# Local/dev without a real widget: use Cloudflare's always-pass test site key:
#   TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
#   and in .dev.vars: TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
# Or leave both unset — verification is bypassed with a console warning.

# --- Secrets (never stored in this file) ---
# Set with: wrangler secret put TOKEN_SECRET            (generate: openssl rand -hex 32)
# Set with: wrangler secret put RESEND_API_KEY
# Set with: wrangler secret put ADMIN_PASSWORD           (admin dashboard at /app/admin + password sign-in on /app/login for ADMIN_EMAIL)
# Set with: wrangler secret put REVIEWER_PASSWORD        (password sign-in on /app/login for REVIEWER_EMAIL, once that var is uncommented above)
# Set with: wrangler secret put TURNSTILE_SECRET_KEY     (Turnstile widget secret from CF dashboard)
# Set with: wrangler secret put GEMINI_API_KEY           (Google AI Studio key — /tools/ai-document-generator; free tier, see lib/geminiDocGen.ts)
# Set with: wrangler secret put STRIPE_SECRET_KEY
# Set with: wrangler secret put STRIPE_WEBHOOK_SECRET
# Cloud storage OAuth (optional — Connect buttons return 503 until set):
#   Redirect URIs (register in each provider console):
#     https://api.docstoc.io/api/account/connectors/dropbox/callback
#     https://api.docstoc.io/api/account/connectors/onedrive/callback
#     https://api.docstoc.io/api/account/connectors/box/callback
#     https://api.docstoc.io/api/account/connectors/google/callback
#   Login redirect: https://api.docstoc.io/api/auth/google/callback
# Set with: wrangler secret put GOOGLE_LOGIN_CLIENT_SECRET
# Set with: wrangler secret put GOOGLE_INTEGRATIONS_CLIENT_SECRET
# Set with: wrangler secret put DROPBOX_CLIENT_ID
# Set with: wrangler secret put DROPBOX_CLIENT_SECRET
# Set with: wrangler secret put ONEDRIVE_CLIENT_ID
# Set with: wrangler secret put ONEDRIVE_CLIENT_SECRET
# Set with: wrangler secret put BOX_CLIENT_ID
# Set with: wrangler secret put BOX_CLIENT_SECRET
# Native accounting OAuth (optional):
#   https://api.docstoc.io/api/account/connectors/quickbooks/callback
#   https://api.docstoc.io/api/account/connectors/xero/callback
# Set with: wrangler secret put QBO_CLIENT_ID
# Set with: wrangler secret put QBO_CLIENT_SECRET
# Set with: wrangler secret put XERO_CLIENT_ID
# Set with: wrangler secret put XERO_CLIENT_SECRET
# Microsoft Clarity Data Export API (optional — admin dashboard reads cached data, refreshed daily
# by cron; shows "not connected" until set). Generate a token in Clarity: open the Chasa project at
# clarity.microsoft.com -> Settings -> Data Export -> API tokens. Token is project-scoped, no
# separate project id needed.
# Set with: wrangler secret put CLARITY_API_TOKEN
# Cloudflare Analytics (optional — admin dashboard Traffic tab). Token needs Zone → Analytics → Read
# on docstoc.io and chasa.io (both queried and merged automatically). Optional override:
#   wrangler secret put CF_ANALYTICS_ZONE_IDS   (comma-separated zone IDs)
# Set with: wrangler secret put CF_ANALYTICS_TOKEN
# Analytics Engine dual-write parity check (admin dashboard, Analytics Engine cutover project).
# Distinct scope from CF_ANALYTICS_TOKEN above — this one is Account-level, not Zone-level.
# Set with: wrangler secret put CF_ACCOUNT_ID              (Cloudflare account id, Workers & Pages overview page)
# Set with: wrangler secret put CF_ANALYTICS_ENGINE_TOKEN  (API token scoped to Account > Analytics > Read)
# Price IDs are non-secret — set above as STRIPE_PRICE_SOLO / PRO / ENTERPRISE.

# --- Staging: isolated D1 so testing never touches production data ---
# Deploy with: wrangler deploy --env staging
# Secrets: wrangler secret put TOKEN_SECRET --env staging (RESEND_API_KEY intentionally left
# unset here — emails just log to the console instead of actually sending during testing)
[env.staging]
name = "chasa-worker-staging"

[[env.staging.d1_databases]]
binding = "CHASA_DB"
database_name = "chasa-db-staging"
database_id = "REPLACE_WITH_STAGING_D1_DATABASE_ID"

[[env.staging.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "docstoc_funnel_staging"

[env.staging.ai]
binding = "AI"

[env.staging.vars]
PUBLIC_APP_URL = "http://localhost:5173"
PUBLIC_WORKER_URL = "https://chasa-worker-staging.workers.dev"
WORKERS_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
FEEDBACK_EMAIL = "founder@docstoc.io"
STRIPE_PRICE_SOLO = "price_1U8eQrQu2Ibd9xnHMVO69tv4"
STRIPE_PRICE_PRO = "price_1TxMyFQu2Ibd9xnHPDe4L9q4"
STRIPE_PRICE_ENTERPRISE = "price_1U8eRIQu2Ibd9xnH56dwoOJ6"
